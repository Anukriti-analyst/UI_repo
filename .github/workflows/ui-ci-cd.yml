name: UI CI and Azure Web App CD

on:
  pull_request:
    branches:
      - develop
      - 'release/**'
      - main
    types: [closed]
  push:
    tags:
      - 'release-*'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint 2>&1 | tee lint-report.txt

      - name: Publish lint report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.txt
          if-no-files-found: error
          retention-days: 7

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        if: vars.SONAR_HOST_URL != '' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >-
            -Dsonar.projectKey=fme-policy-proposal-intake-manager
            -Dsonar.sources=src
            -Dsonar.exclusions=dist/**,node_modules/**
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Report missing SonarQube configuration
        if: vars.SONAR_HOST_URL == '' || env.SONAR_TOKEN == ''
        run: echo "::warning::SonarQube scan skipped because configuration is missing."

      - name: Publish SonarQube report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report
          path: .scannerwork/**
          if-no-files-found: ignore
          retention-days: 7

  ci:
    name: Build
    needs: [lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    env:
      VITE_API_BASE_URL: ${{ (github.event_name == 'push' && vars.VITE_UAT_API_BASE_URL) || (github.base_ref == 'main' && vars.VITE_PROD_API_BASE_URL) || (github.base_ref == 'develop' && vars.VITE_DEV_API_BASE_URL) || (startsWith(github.base_ref, 'release/') && vars.VITE_QA_API_BASE_URL) || vars.VITE_API_BASE_URL || 'https://enablr-gch2agdgfme6fedr.centralus-01.azurewebsites.net' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Prepare build artifacts
        run: |
          mkdir -p build-artifacts
          cp -R dist build-artifacts/dist
          cp package.json package-lock.json build-artifacts/
          printf 'commit=%s\nref=%s\n' "$GITHUB_SHA" "$GITHUB_REF" > build-artifacts/build-metadata.txt

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts
          if-no-files-found: error
          retention-days: 7

  veracode:
    name: Veracode
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    continue-on-error: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'main') }}
    env:
      VERACODE_API_ID: ${{ secrets.VERACODE_API_ID || '' }}
      VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package application for Veracode scan
        if: env.VERACODE_API_ID != '' && env.VERACODE_API_KEY != ''
        run: zip -r veracode-source.zip . -x '.git/*' 'node_modules/*' 'dist/*'

      - name: Run Veracode scan
        if: env.VERACODE_API_ID != '' && env.VERACODE_API_KEY != ''
        uses: veracode/Veracode-pipeline-scan-action@v1.0.20
        with:
          vid: ${{ env.VERACODE_API_ID }}
          vkey: ${{ env.VERACODE_API_KEY }}
          file: veracode-source.zip
          fail_build: true

      - name: Skip Veracode when not configured
        if: env.VERACODE_API_ID == '' || env.VERACODE_API_KEY == ''
        run: echo "::warning::Veracode scan skipped because credentials are missing."

      - name: Block main branch when Veracode is not configured
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && (env.VERACODE_API_ID == '' || env.VERACODE_API_KEY == '')
        run: exit 1

      - name: Publish Veracode report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veracode-report
          path: |
            veracode-source.zip
            results*.json
          if-no-files-found: ignore
          retention-days: 7

  deploy-dev:
    name: Deploy to Dev
    needs: [ci]
    if: >-
      needs.ci.result == 'success' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/release-')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: release

      - name: Deploy to Dev
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release

  # ##################### GitHub Environments #####################
  #
  # A GitHub Environment represents a deployment target such as QA, UAT, or PROD.
  # Environments allow deployment-specific controls and configuration to be kept
  # separate from the application source code and from other environments.
  #
  # Configure each environment from:
  # Repository Settings > Environments > QA, UAT, or PROD.
  #
  # Recommended configuration for QA, UAT, and PROD:
  # 1. Enable Required reviewers and add the approved reviewer or team.
  # 2. Enable Prevent self-review when the approver must be different from the
  #    person who started the workflow.
  # 3. Configure Deployment branches and tags to restrict which refs may deploy.
  # 4. Add environment secrets, such as AZURE_WEBAPP_PUBLISH_PROFILE, when the
  #    value must be encrypted and must only be available during that deployment.
  # 5. Add environment variables, such as AZURE_WEBAPP_NAME or API URLs, when the
  #    value is non-sensitive and differs between QA, UAT, and PROD.
  # 6. Optionally configure a wait timer or additional deployment protection rules.
  # 7. Save the protection rules before running the workflow.
  #
  # When a job references an environment, GitHub pauses the job before deployment
  # until its protection rules are satisfied. Environment secrets are only exposed
  # after approval, which reduces accidental deployments and protects credentials.
  # This also provides an approval audit trail, controlled promotion, and clear
  # separation of QA, UAT, and PROD configuration. Dev remains automatic here.
  #
  # ##################### End GitHub Environments #####################
  
  deploy-qa:
    name: Deploy to QA
    needs: [deploy-dev]
    if: needs.deploy-dev.result == 'success'
    runs-on: ubuntu-latest
    environment: QA
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: release

      - name: Deploy to QA
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release

  deploy-uat:
    name: Deploy to UAT
    needs: [deploy-qa]
    if: needs.deploy-qa.result == 'success'
    runs-on: ubuntu-latest
    environment: UAT
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: release

      - name: Deploy to UAT
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release

  deploy-prod:
    name: Deploy to Production
    needs: [deploy-uat]
    if: needs.deploy-uat.result == 'success'
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: release

      - name: Deploy to Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release


