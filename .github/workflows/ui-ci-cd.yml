name: UI CI and Azure Web App CD

on:
  pull_request:
    branches:
      - develop
      - 'release/**'
      - main
    types: [closed]
  push:
    tags:
      - 'release-*'

permissions:
  contents: read

concurrency:
  group: ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  sonarqube:
    needs: lint
    uses: ./.github/workflows/sonarqube.yml
    secrets: inherit

  ci:
    needs: sonarqube
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  veracode:
    needs: ci
    uses: ./.github/workflows/veracode.yml
    secrets: inherit

  cd:
    needs: [ci, sonarqube, veracode]
    if: >-
      always() && needs.ci.result == 'success' && needs.sonarqube.result == 'success' &&
      (needs.veracode.result == 'success' || github.base_ref != 'main')
    uses: ./.github/workflows/cd.yml
    secrets: inherit
