name: UI CI and Azure Web App CD

on:
  pull_request:
    branches:
      - develop
      - 'release/**'
      - main
    types: [closed]
  push:
    tags:
      - 'release-*'

permissions:
  contents: read

# concurrency:
#   group: ui-${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint 2>&1 | tee lint-report.txt

      - name: Publish lint report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.txt
          if-no-files-found: error
          retention-days: 7

